services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dogo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dogo_dev
    ports:
      - "5432:5432"
    volumes:
      - dogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dogo_pgdata:
